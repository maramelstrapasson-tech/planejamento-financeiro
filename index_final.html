  <script>
    const toast = document.getElementById('offline-toast');
    const toastText = document.getElementById('offline-toast-text');
    let toastTimer = null;

    function showToast(msg, duration){
      if(toastTimer) clearTimeout(toastTimer);
      toastText.textContent = msg;
      toast.style.display = 'flex';
      requestAnimationFrame(()=>{ toast.style.opacity = '1'; });
      if(duration){
        toastTimer = setTimeout(()=>{
          toast.style.opacity = '0';
          setTimeout(()=>{ toast.style.display = 'none'; }, 400);
        }, duration);

// =============================================
// CONTROLE FINANCEIRO DOMÉSTICO v4

const {
  useState,

// ─── Feriados Nacionais Fixos (mês, dia) ────────────────────
const FERIADOS_FIXOS = [[1, 1], [4, 21], [5, 1], [9, 7], [10, 12], [11, 2], [11, 15], [11, 20], [12, 25]];
function isFeriadoOuFimDeSemana(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const dow = dt.getDay();
  if (dow === 0 || dow === 6) return true;
  // Páscoa (algoritmo de Butcher)
  const a = y % 19,
    b = Math.floor(y / 100),
    c = y % 100,
    d2 = Math.floor(b / 4),
    e = b % 4,
    f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3),
    h = (19 * a + b - d2 - g + 15) % 30,
    i = Math.floor(c / 4),
    k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7,
    m2 = Math.floor((a + 11 * h + 22 * l) / 451),
    mes = Math.floor((h + l - 7 * m2 + 114) / 31),
    dia = (h + l - 7 * m2 + 114) % 31 + 1;
  const pascoa = new Date(y, mes - 1, dia);
  const carnaval2 = new Date(pascoa);
  carnaval2.setDate(pascoa.getDate() - 48);
  const carnaval3 = new Date(pascoa);
  carnaval3.setDate(pascoa.getDate() - 47);
  const sextaSanta = new Date(pascoa);
  sextaSanta.setDate(pascoa.getDate() - 2);
  const corpusChristi = new Date(pascoa);
  corpusChristi.setDate(pascoa.getDate() + 60);
  const feriadosMov = [carnaval2, carnaval3, sextaSanta, pascoa, corpusChristi];
  if (feriadosMov.some(f => f.getFullYear() === y && f.getMonth() === m - 1 && f.getDate() === d)) return true;
  return FERIADOS_FIXOS.some(([fm, fd]) => fm === m && fd === d);
}
function proximoDiaUtil(dateStr) {
  let dt = dateStr;
  while (isFeriadoOuFimDeSemana(dt)) {
    const [y, m, d] = dt.split('-').map(Number);
    const next = new Date(y, m - 1, d + 1);
    dt = next.toISOString().split('T')[0];
  }
  return dt;
}
function fmtDataBR(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return `${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}/${y}`;
}
// Verifica se uma data de vencimento cai em fim de semana/feriado e, se cair,
// PERGUNTA ao usuário se quer usar o próximo dia útil ou manter a data escolhida
// (nunca ajusta silenciosamente). Retorna a data final a ser usada.
function confirmarDiaUtil(dateStr) {
  if (!dateStr || !isFeriadoOuFimDeSemana(dateStr)) return dateStr;
  const [y, m, d] = dateStr.split('-').map(Number);
  const dow = new Date(y, m - 1, d).getDay();
  const motivo = dow === 0 ? 'domingo' : dow === 6 ? 'sábado' : 'feriado';
  const ajustada = proximoDiaUtil(dateStr);
  const mover = confirm(`📅 O vencimento ${fmtDataBR(dateStr)} cai em um ${motivo}.\n\n` + `OK = usar o próximo dia útil (${fmtDataBR(ajustada)})\n` + `Cancelar = manter o vencimento em ${fmtDataBR(dateStr)}`);
  return mover ? ajustada : dateStr;
}

function today() {

function monthKey(y, m) {

}
function monthStart(y, m) {
  return `${monthKey(y, m)}-01`;
}
function monthEnd(y, m) {
  // Cálculo puro — sem Date() para evitar bugs de timezone no servidor
  const dias = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  const bis = y % 4 === 0 && y % 100 !== 0 || y % 400 === 0;
  const ultimo = m === 2 && bis ? 29 : dias[m];
  return `${String(y)}-${String(m).padStart(2, '0')}-${String(ultimo).padStart(2, '0')}`;
}
function currentYM() {

  let nm = m + n,

  while (nm > 12) {

  };
}

// ─── Saldo carry-over entre meses ───────────────────────────
// ─── Regra ÚNICA de impacto de uma transação no saldo de uma conta ───
// Usada por calcularSaldosMensais (Dashboard/Contas) E pelo Relatório, garantindo
// que os dois nunca divirjam entre si.
function aplicarMovimentoConta(mapa, t, contasNormais) {
  if (t.tipo === 'Receita' && contasNormais.has(t.conta_id)) {
    mapa[t.conta_id] = (mapa[t.conta_id] || 0) + (t.valor || 0);
  } else if (t.tipo === 'Despesa' && contasNormais.has(t.conta_id)) {
    mapa[t.conta_id] = (mapa[t.conta_id] || 0) - (t.valor || 0);
  } else if (t.tipo === 'Transferência') {
    if (t.status === 'Cancelado') return;
    const origemNormal = contasNormais.has(t.conta_id);
    const destinoNormal = t.conta_destino_id && contasNormais.has(t.conta_destino_id);
    const isAutoCartao = t.descricao?.includes('[AUTO_CARTAO]');
    if (isAutoCartao) {
      // Fatura de cartão [AUTO_CARTAO]: é SEMPRE o MESMO registro (fechar_fatura cria
      // como Pendente; confirmar_pagamento apenas atualiza o status do mesmo id — nunca
      // duplica). Por isso o banco de origem é debitado igualmente em Pendente OU
      // Confirmado (o cálculo é recomputado do zero a cada render, a partir do status
      // ATUAL — não há risco de debitar duas vezes o mesmo registro).
      if (origemNormal) mapa[t.conta_id] = (mapa[t.conta_id] || 0) - (t.valor || 0);
      // O cartão (conta_destino_id) não é "conta normal" — não participa deste somatório.
    } else if (t.status === 'Confirmado') {
      // Transferência normal Confirmada: subtrai origem, soma destino
      if (origemNormal) mapa[t.conta_id] = (mapa[t.conta_id] || 0) - (t.valor || 0);
      if (destinoNormal) mapa[t.conta_destino_id] = (mapa[t.conta_destino_id] || 0) + (t.valor || 0);
    }
    // Transferências normais Pendentes (não AUTO_CARTAO): não afetam saldo ainda
  }
}
function contasNormaisSet(contas) {
  return new Set(contas.filter(c => c.tipo !== 'Cartão de Crédito').map(c => c.id));
}
function calcularSaldosMensais(contas, transacoes, anoMes) {
  const {
    y,
    m
  } = anoMes;
  const inicio = monthStart(y, m);
  const fim = monthEnd(y, m);

  // Cartões de crédito têm lógica própria via calcularCartoes().
  // Eles NÃO participam do acúmulo de saldo bancário.
  const contasNormais = contasNormaisSet(contas);

  // Saldo base: saldo_inicial de cada conta normal
  const saldosBase = {};
  for (const c of contas) {
    saldosBase[c.id] = c.tipo === 'Cartão de Crédito' ? 0 : c.saldo_inicial || 0;
  }

  // Acumula transações ANTERIORES ao mês (constrói saldo de abertura)
  for (const t of transacoes) {
    if (!t.data || t.data >= inicio || t.status === 'Cancelado') continue;
    aplicarMovimentoConta(saldosBase, t, contasNormais);
  }

  // Acumula transações DO mês (constrói saldo de fechamento)
  const saldosFim = {
    ...saldosBase
  };
  for (const t of transacoes) {
    if (!t.data || t.data < inicio || t.data > fim || t.status === 'Cancelado') continue;
    aplicarMovimentoConta(saldosFim, t, contasNormais);
  }
  return {
    saldosInicio: saldosBase,
    saldosFim
  };
}

// ─── Cartão de crédito: autosoma e limite ───────────────────
function calcularCartoes(contas, transacoes, y, m) {
  const cartoes = contas.filter(c => c.tipo === 'Cartão de Crédito');
  const inicio = monthStart(y, m);
  const fim = monthEnd(y, m);
  const hoje = today();
  return cartoes.map(cartao => {
    const limite = cartao.limite || 0;

    // Fatura do mês exibido (todas as despesas não canceladas)

    // Se a fatura consolidada [AUTO_CARTAO] deste mês já foi CONFIRMADA (paga),

    // Identificamos pela descrição que contém o mês/ano no formato "MM/YYYY".

    // Fatura paga: limite totalmente restaurado para este mês

    // Parcelas de parcelamentos reais (não recorrentes) com vencimento
    // em meses FUTUROS ao mês exibido — comprometem o limite agora.
    // Inclui Pendentes E Confirmadas (confirmadas pelo fechamento de fatura
    // de meses anteriores, mas o limite só é liberado quando a fatura daquele
    // mês é paga — enquanto não é, ainda comprometem o limite).
    const parcelasFuturas = transacoes.filter(t => t.conta_id === cartao.id && t.tipo === 'Despesa' && t.data > fim &&
    // após o mês exibido
    t.status !== 'Cancelado' && t.parcela_id && (t.total_parcelas || 0) > 1 // parcelamento real (total_parcelas=0 é recorrente)
    ).reduce((a, t) => a + (t.valor || 0), 0);

    // Se a fatura consolidada [AUTO_CARTAO] de um mês futuro já foi CONFIRMADA
    // (paga), as parcelas daquele mês não comprometem mais o limite.
    // Verificamos mês por mês das parcelas futuras.
    const mesesFuturosPagos = new Set();

      const fy = y + Math.floor((fm - 1) / 12);
      const mm = (fm - 1) % 12 + 1;
      const fmesStr = String(mm).padStart(2, '0') + '/' + fy;
      const faturaFuturaPaga = cartao.banco_vinculado_id ? transacoes.find(t => t.tipo === 'Transferência' && t.conta_id === cartao.banco_vinculado_id && t.conta_destino_id === cartao.id && t.status === 'Confirmado' && t.descricao?.includes('[AUTO_CARTAO]') && t.descricao?.includes(fmesStr)) : null;
      if (faturaFuturaPaga) mesesFuturosPagos.add(fmesStr);
    }
    // Subtrair parcelas de meses cuja fatura já foi paga
    const parcelasFuturasLiquidas = transacoes.filter(t => {
      if (!(t.conta_id === cartao.id && t.tipo === 'Despesa' && t.data > fim && t.status !== 'Cancelado' && t.parcela_id && (t.total_parcelas || 0) > 1)) return false;
      // Verificar se a fatura do mês desta parcela já foi paga
      const [py, pm2, pd] = t.data.split('-').map(Number);
      const pmesStr = String(pm2).padStart(2, '0') + '/' + py;
      return !mesesFuturosPagos.has(pmesStr);
    }).reduce((a, t) => a + (t.valor || 0), 0);
    const limiteUsado = gastosMes + parcelasFuturasLiquidas;
    // Garante que limiteDisp nunca ultrapasse o limite total
    const limiteDisp = Math.max(0, limite - limiteUsado);

    // "Saldo anterior" do cartão = fatura pendente de pagamento
    // Enquanto existe fatura [AUTO_CARTAO] pendente, o limite ainda está comprometido
    const faturaPendenteMes = cartao.banco_vinculado_id ? transacoes.find(t => t.tipo === 'Transferência' && t.conta_id === cartao.banco_vinculado_id && t.conta_destino_id === cartao.id && t.status === 'Pendente' && t.descricao?.includes('[AUTO_CARTAO]') && t.descricao?.includes(mesStr)) : null;

    // limiteAnterior = limite total menos o que estava comprometido ANTES das despesas do mês
    // Quando há fatura pendente: mostra quanto o limite estava antes de ser comprometido pela fatura
    const limiteAnterior = faturaPendenteMes ? Math.max(0, limite - parcelasFuturasLiquidas) // limite sem a fatura corrente (pré-fatura)
    : null; // null = sem fatura pendente, não exibe

    return {
      ...cartao,
      limite,
      gastosMes,
      parcelasFuturas: parcelasFuturasLiquidas,
      limiteUsado,
      limiteDisp,
      faturaPendente: faturaPendenteMes || null,
      limiteAnterior
    };
  });
}

function AuthScreen({
  onLogin
}) {
  const [tab, setTab] = useState('login');
  const [form, setForm] = useState({
    nome: '',
    email: '',
    senha: '',
    confirma: ''
  });
  const [erro, setErro] = useState('');
  const [loading, setLoading] = useState(false);
  const [showPass, setShowPass] = useState(false);
  function handle(e) {
    setForm({
      ...form,
      [e.target.name]: e.target.value
    });
    setErro('');
  }
  async function submit(e) {
    e.preventDefault();
    setErro('');
    if (tab === 'register' && form.senha !== form.confirma) {
      setErro('As senhas não coincidem');
      return;
    }
    setLoading(true);
    try {
      const res = await callAuth({
        action: tab === 'login' ? 'login' : 'register',
        email: form.email,
        senha: form.senha,
        nome: form.nome
      });
      if (res.ok) {
        localStorage.setItem('cfd_token', res.token);
        localStorage.setItem('cfd_user', JSON.stringify(res.user));
        onLogin(res.user, res.token);
      } else {
        setErro(res.error || 'Erro desconhecido');
      }
    } catch {
      setErro('Erro de conexão. Tente novamente.');
    }
