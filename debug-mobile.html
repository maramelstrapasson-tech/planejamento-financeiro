<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Drill-down</title></head>
<body style="margin:0;background:#111;padding:10px">
<script>
(async function(){
  try {
    const r = await fetch('https://superagent-995f94be.base44.app/functions/auth', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',email:'teste.celular@app.com',senha:'teste123456'})});
    const j = await r.json();
    if(j.ok){ localStorage.setItem('cfd_token', j.token); localStorage.setItem('cfd_user', JSON.stringify(j.user)); }
  } catch(e){}
  const f = document.createElement('iframe');
  f.width = 390; f.height = 844;
  f.style.cssText = 'border:2px solid #444;background:#fff';
  f.src = 'https://maramelstrapasson-tech.github.io/planejamento-financeiro/?v=6';
  document.body.appendChild(f);
  f.onload = function(){
    const nav = (tries) => {
      if(tries <= 0) return;
      try {
        const d = f.contentWindow.document;
        const ok = [...d.querySelectorAll('button')].find(b => b.textContent.trim() === 'Entendi!');
        if(ok) ok.click();
        const btn = [...d.querySelectorAll('button')].find(b => b.textContent.includes('Transa'));
        if(btn && !btn.className.includes('bg-blue-100')) btn.click();
      } catch(e){}
      setTimeout(() => nav(tries-1), 1500);
    };
    setTimeout(() => nav(12), 2500);
    setTimeout(() => {
      const rep = [];
      try {
        const w = f.contentWindow, d = w.document, root = d.documentElement;
        rep.push('scrollW=' + root.scrollWidth + ' clientW=' + root.clientWidth);
        let cur = d.body;
        for (let level = 0; level < 14; level++) {
          const kids = [...cur.querySelectorAll(':scope > *')].filter(el => !['SCRIPT','STYLE','LINK'].includes(el.tagName));
          const before = root.scrollWidth;
          let culprit = null;
          for (const k of kids) {
            const prev = k.style.display;
            k.style.display = 'none';
            const now = root.scrollWidth;
            k.style.display = prev;
            if (now < before - 2) { culprit = k; break; }
          }
          if (!culprit) { rep.push('nv' + level + ': sem culpado em <' + cur.tagName.toLowerCase() + '> (w=' + Math.round(cur.getBoundingClientRect().width) + ')'); break; }
          rep.push('nv' + level + ': <' + culprit.tagName.toLowerCase() + '> w=' + Math.round(culprit.getBoundingClientRect().width) + ' | ' + String(culprit.className).slice(0,90));
          if (!culprit.querySelector('*')) { rep.push('FOLHA ENCONTRADA acima'); break; }
          cur = culprit;
        }
      } catch(e) { rep.push('ERRO: ' + e.message); }
      const pre = document.createElement('pre');
      pre.textContent = rep.join('\n');
      pre.style.cssText = 'color:#0f0;font:11px monospace;white-space:pre-wrap;margin:10px;max-width:500px';
      document.body.appendChild(pre);
    }, 16000);
  };
})();
</script>
</body></html>
