<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Emulador Mobile</title></head>
<body style="margin:0;background:#111;padding:10px">
<script>
(async function(){
  try {
    const r = await fetch('https://superagent-995f94be.base44.app/functions/auth', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',email:'teste.celular@app.com',senha:'teste123456'})});
    const j = await r.json();
    if(j.ok){ localStorage.setItem('cfd_token', j.token); localStorage.setItem('cfd_user', JSON.stringify(j.user)); }
  } catch(e){}
  const f = document.createElement('iframe');
  f.width = 390; f.height = 844;
  f.style.cssText = 'border:2px solid #444;background:#fff';
  f.src = 'https://maramelstrapasson-tech.github.io/planejamento-financeiro/?v=5';
  document.body.appendChild(f);
  f.onload = function(){
    const nav = (tries) => {
      if(tries <= 0) return;
      try {
        const d = f.contentWindow.document;
        const ok = [...d.querySelectorAll('button')].find(b => b.textContent.trim() === 'Entendi!');
        if(ok) ok.click();
        const btn = [...d.querySelectorAll('button')].find(b => b.textContent.includes('Transa'));
        if(btn && !btn.className.includes('bg-blue-100')) btn.click();
      } catch(e){}
      setTimeout(() => nav(tries-1), 1500);
    };
    setTimeout(() => nav(12), 2500);
    setTimeout(() => {
      try {
        const w = f.contentWindow, d = w.document, root = d.documentElement;
        const rep = [];
        rep.push('scrollW=' + root.scrollWidth + ' clientW=' + root.clientWidth);
        const h1 = d.querySelector('h1');
        if(h1) rep.push('h1 font=' + w.getComputedStyle(h1).fontSize);
        d.querySelectorAll('*').forEach(el => {
          const r = el.getBoundingClientRect();
          if (r.width > 391 || r.right > 391) {
            if (rep.length < 35) rep.push('OVF <' + el.tagName.toLowerCase() + '> w=' + Math.round(r.width) + ' right=' + Math.round(r.right) + ' | ' + String(el.className).slice(0,70));
          }
        });
        d.querySelectorAll('img').forEach(img => { if(img.naturalWidth === 0) rep.push('IMG QUEBRADA: ' + img.src.slice(0,50)); });
        const pre = document.createElement('pre');
        pre.textContent = rep.length > 2 ? rep.join('\n') : 'SEM OVERFLOW DETECTADO';
        pre.style.cssText = 'color:#0f0;font:11px monospace;white-space:pre-wrap;margin:10px;max-width:500px';
        document.body.appendChild(pre);
      } catch(e) { document.body.appendChild(Object.assign(document.createElement('pre'), {textContent:'ERRO DIAG: ' + e.message, style:'color:#f00;font:11px monospace'})); }
    }, 16000);
  };
})();
</script>
</body></html>
